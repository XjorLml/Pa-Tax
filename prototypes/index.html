<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax Buddy Prototype</title>
<meta name="description" content="Clickable design prototype of Tax Buddy release 1. A proposal for review, not an approved design.">
<style>
/* ===== Prototype chrome: not part of the site, so it stays neutral for every look ===== */
:root{--page:#E9ECEF;--bar:#F8F9FA;--frame:#1F2328;--c-surface:#FFFFFF;--c-surface-2:#EEF0F2;--c-text:#1A1D21;--c-muted:#565D66;--c-border:#C3CAD2;--c-accent:#30363D;--c-on-accent:#FFFFFF;--c-focus:#2563EB;--shadow:0 10px 30px rgba(20,24,28,.18);color-scheme:light}
:root[data-theme="dark"]{--page:#0C0E11;--bar:#14171B;--frame:#30363D;--c-surface:#1A1E23;--c-surface-2:#242930;--c-text:#E6E9ED;--c-muted:#A0A8B3;--c-border:#3A424C;--c-accent:#D0D7DE;--c-on-accent:#14171B;--c-focus:#7AA7FF;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--page);color:var(--c-text);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{flex:none}
.pbar{position:sticky;top:0;z-index:100;display:grid;gap:10px;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--c-border)}
.prow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
.ptitle{margin-right:auto;min-width:220px}
.ptitle strong{display:block;font-size:15px}
.ptitle span{font-size:12px;color:var(--c-muted)}
.pctl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--c-muted)}
.pctl select{min-height:34px;padding:4px 8px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface);color:var(--c-text);font-size:13px}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface)}
.seg button{min-height:34px;padding:6px 12px;border:0;background:transparent;color:var(--c-text);font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--c-border)}
.seg button[aria-pressed="true"]{background:var(--c-accent);color:var(--c-on-accent)}
.pchk{display:flex;align-items:center;gap:6px;min-height:34px;font-size:13px}
.pchk input{width:16px;height:16px}
.pbtn{min-height:34px;padding:6px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface);color:var(--c-text);font-size:13px;cursor:pointer}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:24px;padding:24px 16px 56px}
.notes{width:330px;max-width:100%;padding:16px;font-size:13.5px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:12px}
.stage.desk .notes{width:min(1120px,100%)}
.notes h2{margin:0 0 4px;font-size:15px}
.notes h3{margin:14px 0 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-muted)}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:4px 0}
.notes .id{font-weight:700}
.notes .small,.notes .muted{color:var(--c-muted)}
.tries{display:flex;flex-wrap:wrap;gap:6px}
.proto-err{position:fixed;right:12px;bottom:12px;left:12px;z-index:200;display:none;padding:10px 14px;color:#fff;background:#B42318;border-radius:8px}

/* ===== The three looks (generated: colour, type and shape tokens) ===== */
.device[data-look="ledger"]{--font-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--font-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--head-weight:600;--head-track:0;--r-sm:3px;--r-md:4px;--r-lg:6px;--r-pill:4px;--r-avatar:4px;--r-btn:4px;--bubble-r:6px;--elev:none;--elev-hover:none;--dur:80ms;--app-bg:#F6F2EA;--surface:#FFFDF9;--surface-2:#EEE8DC;--text:#1A2233;--muted:#566075;--border:#DAD3C4;--ctl:#857E6E;--primary:#1F3A5F;--primary-strong:#152A46;--primary-edge:#1F3A5F;--on-primary:#FFFFFF;--link:#1F3A5F;--primary-soft:#E2E9F2;--on-soft:#1A3050;--t1:#E2E9F2;--t2:#E2E9F2;--t3:#E2E9F2;--danger:#A3271B;--on-danger:#FFFFFF;--danger-soft:#F8E7E3;--warn:#6B4B00;--warn-soft:#F8ECCB;--ok:#1B6A40;--ok-soft:#E2F1E7;--focus:#1D4ED8;--overlay:rgba(20,26,38,.5)}
:root[data-theme="dark"] .device[data-look="ledger"]{--app-bg:#11151C;--surface:#19202B;--surface-2:#232C39;--text:#ECE9E2;--muted:#A7AFBD;--border:#2F3948;--ctl:#7A8595;--primary:#A9C3E6;--primary-strong:#C4D6EF;--primary-edge:#A9C3E6;--on-primary:#0F1D30;--link:#A9C3E6;--primary-soft:#22334C;--on-soft:#C9DAF0;--t1:#22334C;--t2:#22334C;--t3:#22334C;--danger:#F19A90;--on-danger:#2B0D0A;--danger-soft:#3A1F1C;--warn:#ECC878;--warn-soft:#33290F;--ok:#82D5A6;--ok-soft:#16301F;--focus:#8FB4FF;--overlay:rgba(0,0,0,.6)}
.device[data-look="neighbourly"]{--font-head:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--font-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--head-weight:700;--head-track:-0.01em;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:999px;--r-avatar:50%;--r-btn:999px;--bubble-r:20px;--elev:0 1px 2px rgba(60,30,10,.06),0 4px 14px rgba(60,30,10,.06);--elev-hover:0 2px 4px rgba(60,30,10,.08),0 8px 22px rgba(60,30,10,.10);--dur:180ms;--app-bg:#FFF7EE;--surface:#FFFFFF;--surface-2:#FBEAD9;--text:#2A1C14;--muted:#6A5347;--border:#EDD9C6;--ctl:#9B7F6B;--primary:#F4B63F;--primary-strong:#E9A520;--primary-edge:#9A6400;--on-primary:#2A1C14;--link:#8A3F0C;--primary-soft:#FDE6D3;--on-soft:#7A3410;--t1:#FDE6D3;--t2:#DDF0E4;--t3:#E4E6FA;--danger:#B3261E;--on-danger:#FFFFFF;--danger-soft:#FCE8E6;--warn:#6F4A00;--warn-soft:#FFF3CF;--ok:#1F6B45;--ok-soft:#E3F3E8;--focus:#1D4ED8;--overlay:rgba(42,28,20,.5)}
:root[data-theme="dark"] .device[data-look="neighbourly"]{--app-bg:#1A1410;--surface:#241C17;--surface-2:#30251E;--text:#F4EAE0;--muted:#C2AEA0;--border:#3F3129;--ctl:#8F7B6D;--primary:#F4B63F;--primary-strong:#F8C765;--primary-edge:#F4B63F;--on-primary:#2A1C14;--link:#F2B27A;--primary-soft:#46301F;--on-soft:#F8D3B4;--t1:#46301F;--t2:#1F3A2C;--t3:#2C2F52;--danger:#F49B93;--on-danger:#2B0D0A;--danger-soft:#40201D;--warn:#F0CB73;--warn-soft:#3A2E12;--ok:#86D6A9;--ok-soft:#1A3223;--focus:#9DBBFF;--overlay:rgba(0,0,0,.6)}
.device[data-look="clear"]{--font-head:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--font-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--head-weight:600;--head-track:-0.01em;--r-sm:8px;--r-md:10px;--r-lg:14px;--r-pill:999px;--r-avatar:50%;--r-btn:10px;--bubble-r:16px;--elev:0 1px 2px rgba(15,31,28,.06);--elev-hover:0 2px 10px rgba(15,31,28,.10);--dur:140ms;--app-bg:#F3F7F6;--surface:#FFFFFF;--surface-2:#E7EEEC;--text:#0F1F1C;--muted:#50605C;--border:#D2DCD9;--ctl:#788985;--primary:#0B6E60;--primary-strong:#095548;--primary-edge:#0B6E60;--on-primary:#FFFFFF;--link:#0A5F53;--primary-soft:#DCF0EB;--on-soft:#0A4E44;--t1:#DCF0EB;--t2:#DCF0EB;--t3:#DCF0EB;--danger:#B42318;--on-danger:#FFFFFF;--danger-soft:#FCEBE9;--warn:#7A5200;--warn-soft:#FFF3D6;--ok:#17703E;--ok-soft:#E3F4E9;--focus:#2563EB;--overlay:rgba(10,16,14,.5)}
:root[data-theme="dark"] .device[data-look="clear"]{--app-bg:#0E1513;--surface:#151F1D;--surface-2:#1E2A28;--text:#E4ECEA;--muted:#9CB0AB;--border:#2B3936;--ctl:#6E827D;--primary:#52C4B1;--primary-strong:#7AD6C6;--primary-edge:#52C4B1;--on-primary:#04211C;--link:#6FD0BF;--primary-soft:#163430;--on-soft:#A8E4D9;--t1:#163430;--t2:#163430;--t3:#163430;--danger:#F2938A;--on-danger:#2A0D0A;--danger-soft:#3B1E1B;--warn:#F1C66E;--warn-soft:#36290F;--ok:#73D59D;--ok-soft:#14301F;--focus:#7AA7FF;--overlay:rgba(0,0,0,.6)}
.device[data-look="modern"]{--font-head:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--font-body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--head-weight:700;--head-track:-0.02em;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;--r-avatar:50%;--r-btn:999px;--bubble-r:18px;--elev:0 1px 2px rgba(15,27,61,.05),0 8px 24px rgba(15,27,61,.06);--elev-hover:0 2px 6px rgba(15,27,61,.08),0 14px 34px rgba(15,27,61,.12);--dur:150ms;--app-bg:#F6F8FC;--surface:#FFFFFF;--surface-2:#EDF1F8;--text:#0F1B3D;--muted:#4F5B76;--border:#DFE5F0;--ctl:#7B869E;--primary:#2F4FE0;--primary-strong:#2440C0;--primary-edge:#2F4FE0;--on-primary:#FFFFFF;--link:#2440C0;--primary-soft:#E9EEFD;--on-soft:#1B2F8F;--t1:#E9EEFD;--t2:#E3F4EE;--t3:#F3E9FB;--danger:#B42318;--on-danger:#FFFFFF;--danger-soft:#FCEBE9;--warn:#7A5200;--warn-soft:#FFF3D6;--ok:#17703E;--ok-soft:#E3F4E9;--focus:#1D4ED8;--overlay:rgba(15,27,61,.5)}
:root[data-theme="dark"] .device[data-look="modern"]{--app-bg:#0B1020;--surface:#121A2E;--surface-2:#1B2540;--text:#E8ECF7;--muted:#A3AECB;--border:#27324F;--ctl:#6F7DA3;--primary:#8EA2FF;--primary-strong:#AEBDFF;--primary-edge:#8EA2FF;--on-primary:#0B1437;--link:#A5B4FF;--primary-soft:#1C2750;--on-soft:#C9D3FF;--t1:#1C2750;--t2:#153328;--t3:#2D2148;--danger:#F2938A;--on-danger:#2A0D0A;--danger-soft:#3B1E1B;--warn:#F1C66E;--warn-soft:#36290F;--ok:#73D59D;--ok-soft:#14301F;--focus:#9DB2FF;--overlay:rgba(0,0,0,.6)}

/* ===== The site ===== */
.device{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--app-bg);color:var(--text);font-family:var(--font-body);box-shadow:var(--shadow)}
.device.phone{width:390px;height:800px;border:10px solid var(--frame);border-radius:40px}
.device.desktop{width:min(1120px,100%);height:760px;border:1px solid var(--c-border);border-radius:10px}
@media (max-width:820px){
  .device.phone{width:100%;max-width:420px;height:760px;border-width:6px;border-radius:28px}
  .notes{width:100%;max-width:420px}
}
.device :focus-visible{outline-color:var(--focus)}
:where(.device) a{color:var(--link)}
:where(.device) h1,:where(.device) h2,:where(.device) h3{font-family:var(--font-head);font-weight:var(--head-weight);letter-spacing:var(--head-track)}
.device h1:focus,.device h2:focus{outline:none}
.device h1:focus-visible,.device h2:focus-visible{outline:2px solid var(--focus)}
.btn,.chip,.card,.choice,.conv,.mi,.sitenav a,.tabbar a,.tabbar button{transition:background-color var(--dur),border-color var(--dur),box-shadow var(--dur),color var(--dur)}
@keyframes pulse{50%{opacity:.45}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.device *{transition:none !important;animation:none !important}}

/* Frames */
.app{position:relative;display:flex;flex:1;flex-direction:column;min-height:0}
.statusbar{display:flex;flex:none;align-items:center;justify-content:space-between;height:30px;padding:0 22px;font-size:12px;font-weight:600;background:var(--surface)}
.sb-ic{display:flex;align-items:center;gap:6px}
.batt{display:inline-block;width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.urlbar{display:flex;flex:none;padding:2px 12px 8px;background:var(--surface)}
.titlebar{display:flex;flex:none;align-items:center;gap:12px;height:40px;padding-left:12px;font-size:12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.tabname{display:flex;flex:none;align-items:center;gap:6px;white-space:nowrap}
.addr{display:flex;flex:1;align-items:center;gap:6px;min-width:0;padding:5px 12px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.addr span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.titlebar .addr{background:var(--surface)}
.tb-ctrls{display:flex;height:100%}
.tb-ctrls span{display:grid;place-items:center;width:46px;color:var(--muted)}
.appdot{display:inline-grid;flex:none;place-items:center;width:18px;height:18px;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);font:700 11px/1 var(--font-head)}
.appdot.md{width:28px;height:28px;font-size:15px}
.appdot.xl{width:56px;height:56px;margin:0 0 8px;border-radius:var(--r-md);font-size:26px}

/* Phone layout */
.appbar{display:flex;flex:none;align-items:center;gap:4px;min-height:56px;padding:6px 6px 6px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.appbar.has-back{padding-left:4px}
.appbar h1,.pane-head h1,.pane-head h2{flex:1;min-width:0;margin:0;overflow:hidden;font-size:20px;line-height:1.25;white-space:nowrap;text-overflow:ellipsis}
.pane-head h2{font-size:18px}
.content{flex:1;min-height:0;overflow:auto;padding:12px 16px 20px}
.footer{flex:none;padding:10px 16px 14px;background:var(--surface);border-top:1px solid var(--border)}
.tabbar{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--border)}
.tabbar a,.tabbar button{position:relative;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:0;border:0;background:none;font-size:12px;color:var(--muted);text-decoration:none;cursor:pointer}
.tabbar a[aria-current="page"]{color:var(--link);font-weight:700;box-shadow:inset 0 3px 0 var(--link)}
.tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px)}

/* Desktop layout */
.shell{display:flex;flex:1;flex-direction:column;min-height:0}
.sitebar{display:flex;flex:none;align-items:center;gap:24px;min-height:60px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font:var(--head-weight) 18px/1 var(--font-head);color:var(--text);text-decoration:none}
.sitenav{display:flex;flex:1;gap:4px;align-self:stretch}
.sitenav a{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text);text-decoration:none;border-bottom:3px solid transparent;border-top:3px solid transparent}
.sitenav a:hover{background:var(--surface-2)}
.sitenav a[aria-current="page"]{color:var(--link);font-weight:700;border-bottom-color:var(--link)}
.siteuser{display:flex;align-items:center;gap:8px}
.userlink{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 8px;color:var(--text);text-decoration:none;border-radius:var(--r-md)}
.userlink:hover,.userlink[aria-current="page"]{background:var(--surface-2)}
.main{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0}
.panes{display:flex;flex:1;min-height:0}
.pane-list{display:flex;flex:none;flex-direction:column;width:400px;min-height:0;background:var(--app-bg);border-right:1px solid var(--border)}
.pane-detail{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.pane-head{display:flex;flex:none;align-items:center;gap:8px;min-height:56px;padding:8px 12px 8px 20px;border-bottom:1px solid var(--border)}
.pane-scroll{flex:1;min-height:0;overflow:auto;padding:12px 16px}
.pane-scroll.pad{padding:24px 32px}
.pane-scroll .convs{margin:0 -16px}
.single-wrap{display:flex;flex:1;flex-direction:column;min-height:0;background:var(--app-bg)}
.single-wrap .pane-head{background:var(--surface)}
.single-wrap .pane-head{justify-content:center}
.single-wrap .pane-head h1{flex:0 1 680px}
.single{flex:1;min-height:0;overflow:auto;padding:24px}
.single-inner{max-width:680px;margin:0 auto}
.desk-footer{max-width:320px;margin-top:8px}
.empty-detail{display:grid;flex:1;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:900px){.device.desktop .pane-list{width:300px}.sitebar{gap:12px;padding:0 12px}.siteuser .ghost{display:none}}

/* Controls */
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--text);text-decoration:none;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--ctl);border-radius:var(--r-btn);background:var(--surface);color:var(--text);font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--link);background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary-edge);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-strong)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{min-height:24px;padding:0;border:0;background:none;color:var(--link);font-size:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.device.phone .btn.sm,.device.phone .chip{min-height:44px}
.device.phone .linkbtn{min-height:44px;padding:0 6px}
.search{position:relative;margin-bottom:10px}
.search>.ic{position:absolute;top:50%;left:12px;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;min-height:46px;padding:0 44px 0 40px;border:1px solid var(--ctl);border-radius:var(--r-md);background:var(--surface)}
.search .clear{position:absolute;top:1px;right:1px}
.filter{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.filter label{font-size:13.5px;font-weight:600}
.filter select{flex:1;min-height:44px;padding:0 10px;border:1px solid var(--ctl);border-radius:var(--r-md);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--ctl);border-radius:var(--r-pill);background:var(--surface);font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--link)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--link);color:var(--on-soft);font-weight:700}

/* Directory */
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;margin:2px 0 8px;font-size:13px;color:var(--muted)}
.cards{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.card{display:block;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--link);box-shadow:var(--elev-hover)}
a.card[aria-current="true"]{border-color:var(--link);box-shadow:inset 4px 0 0 var(--link)}
.card-top{display:flex;align-items:center;gap:12px}
.card-id{flex:1;min-width:0}
.card h3{margin:0;font-size:16.5px;line-height:1.25}
.sub{margin:0;font-size:13.5px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:10px 0 8px;font-size:13.5px}
.facts span{display:inline-flex;align-items:center;gap:4px}
.clamp{display:-webkit-box;margin:8px 0 0;overflow:hidden;font-size:14px;color:var(--muted);-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tag{padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);font-size:12.5px}
.tag.strong{flex:none;background:var(--primary-soft);color:var(--on-soft);font-weight:700}
.more{display:flex;justify-content:center;margin-top:12px}
.avatar{display:grid;flex:none;place-items:center;width:44px;height:44px;border-radius:var(--r-avatar);background:var(--t1);color:var(--text);font:700 15px/1 var(--font-head)}
.avatar.t2{background:var(--t2)}
.avatar.t3{background:var(--t3)}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.sm{width:30px;height:30px;font-size:12px}

/* Feedback */
.banner{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--border)}
.banner.inline{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--r-md)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.danger{background:var(--danger-soft);color:var(--text)}
.banner.danger .ic{color:var(--danger)}
.banner .ic{margin-top:1px}
.state{padding:40px 16px;text-align:center;color:var(--muted)}
.state h2{margin:12px 0 6px;font-size:18px;color:var(--text)}
.state p{margin:0 0 16px}
.skel{display:grid;gap:10px}
.skeleton{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.sk{height:12px;margin:8px 0;border-radius:6px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite}
.spin.lg{width:32px;height:32px;border-width:3px;color:var(--link)}
.note{display:flex;gap:10px;margin:16px 0 0;padding:10px 12px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-md)}
.note .ic{margin-top:2px}
.placeholder{background:transparent;border:1px dashed var(--ctl)}
.small{font-size:12.5px}
.muted{color:var(--muted)}
.h2{margin:0 0 8px;font-size:20px}
.center-col{max-width:420px;margin:16px auto;text-align:center}
.stack{display:grid;gap:10px;margin:16px 0 10px}
.quote{margin:14px 0 0;padding:10px 14px;text-align:left;background:var(--surface-2);border-left:4px solid var(--link);border-radius:var(--r-sm);white-space:pre-wrap;overflow-wrap:anywhere}
.choices{display:grid;gap:10px;margin-top:14px;text-align:left}
.choice{display:grid;gap:4px;min-height:44px;padding:16px;text-align:left;background:var(--surface);border:1px solid var(--ctl);border-radius:var(--r-lg);cursor:pointer}
.choice:hover{border-color:var(--link);background:var(--surface-2)}
.choice span{font-size:13.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* Profile */
.profile-head{display:flex;align-items:center;gap:16px;margin:4px 0 14px}
.profile-head h2{margin:0;font-size:24px;line-height:1.2}
.profile-head .sub{display:flex;align-items:center;gap:4px}
.facts-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.facts-row li{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--app-bg);font-size:13.5px}
.facts-row strong{font:700 16px/1 var(--font-head)}
.cta{max-width:340px}
.cta-hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.footer .cta-hint{text-align:center}
.section{margin:22px 0}
.section h3,.form legend{margin:0 0 8px;padding:0;font:600 12.5px/1.4 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section p{margin:0}
.timeline{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.timeline li{padding-left:14px;border-left:2px solid var(--ctl)}
.timeline strong{display:block}
.svc,.contact{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.svc li{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md)}
.svc strong{display:block}
.contact li{display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}

/* Chats */
.convs{margin:0 -16px;padding:0;list-style:none}
.conv{display:flex;gap:12px;padding:12px 16px;color:inherit;text-decoration:none;border-bottom:1px solid var(--border)}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--primary-soft);box-shadow:inset 4px 0 0 var(--link)}
.conv-main{display:grid;flex:1;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.conv-top,.conv-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.conv-name{min-width:0;overflow:hidden;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.conv.unread .conv-name{font-weight:800}
.conv-prev{flex:1;min-width:0;overflow:hidden;font-size:13.5px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.conv.unread .conv-prev{color:var(--text)}
.time{font-size:12px;color:var(--muted);white-space:nowrap}
.badge{display:inline-block;min-width:20px;padding:2px 7px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font-size:11.5px;font-weight:700;text-align:center;white-space:nowrap}
.thread{display:flex;flex-direction:column;gap:6px}
.day{align-self:center;margin:10px 0 4px;padding:3px 10px;border-radius:var(--r-pill);background:var(--surface-2);font-size:12px;color:var(--muted)}
.msg{display:flex;flex-direction:column;max-width:82%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start}
.bubble{padding:9px 13px;border-radius:var(--bubble-r);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:var(--r-sm)}
.theirs .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:var(--r-sm)}
.device.desktop .theirs .bubble{background:var(--surface-2)}
.msg.failed .bubble{background:var(--danger-soft);color:var(--text);border:1px solid var(--danger)}
.msg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:3px 4px 0;font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-weight:700}
.thread-intro{padding:20px 8px;font-size:14px;text-align:center;color:var(--muted)}
.thread-intro p{margin:0 0 12px}
.starters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.starters .chip{height:auto;padding:8px 14px;color:var(--text);text-align:left;white-space:normal}
.composer{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px}
.composer textarea{min-height:44px;max-height:120px;padding:11px 12px;line-height:1.35;resize:none;background:var(--app-bg);border:1px solid var(--ctl);border-radius:var(--r-md)}
.composer .btn{padding:0 14px}
.composer-meta{display:flex;grid-column:1/-1;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.over{color:var(--danger);font-weight:700}

/* Forms */
.form fieldset{margin:0 0 22px;padding:0;border:0}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:600}
.req{font-weight:400;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;min-height:44px;padding:9px 12px;background:var(--surface);border:1px solid var(--ctl);border-radius:var(--r-md)}
.field input:disabled{opacity:.55}
.field textarea{min-height:110px;resize:vertical}
.hint{font-size:12.5px;font-weight:400;color:var(--muted)}
.ferr{font-size:13px;font-weight:700;color:var(--danger)}
.field [aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.row{margin-bottom:10px;padding:12px;background:var(--app-bg);border:1px solid var(--border);border-radius:var(--r-md)}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.check input{flex:none;width:20px;height:20px;margin-top:2px}
.check .hint{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:13px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.status-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.checklist{margin:0 0 18px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.checklist p{margin:0 0 8px}
.meter{height:8px;margin:0 0 10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--ctl);border-radius:var(--r-pill)}
.meter span{display:block;height:100%;background:var(--ok)}
.checklist ul{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.checklist li{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px}
.checklist li.done{color:var(--muted)}
.checklist li.done .ic{color:var(--ok)}
.err-summary{margin-bottom:16px;padding:12px 14px;background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--r-md)}
.err-summary h2{margin:0 0 6px;font-size:15.5px;color:var(--danger)}
.err-summary ul{margin:0;padding-left:18px}
.save-status{min-height:1.4em;margin:6px 0 0;font-size:13.5px}
.save-status.ok{color:var(--ok)}
.save-status.fail{color:var(--danger)}

/* Account */
.me-card{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.me-card h2{margin:0;font-size:18px}
.menu{margin:0 0 14px;padding:0;overflow:hidden;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.menu li+li{border-top:1px solid var(--border)}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;text-align:left;color:inherit;text-decoration:none;background:none;border:0;cursor:pointer}
a.mi:hover,button.mi:hover{background:var(--surface-2)}
.mi-main{flex:1;min-width:0}
.mi-main small{display:block;font-size:12.5px;color:var(--muted)}
.mi.danger{color:var(--danger)}
.card.static{padding:18px}
.card.static ul{padding-left:20px}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--overlay)}
.overlay.center,.device.desktop .overlay{align-items:center}
.sheet{width:100%;padding:20px 20px 24px;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow)}
.sheet h2{margin:8px 0;font-size:19px}
.sheet p{margin:0}
.sheet .actions{justify-content:flex-end}
.osnote{position:absolute;top:70px;right:10px;left:10px;z-index:40;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;text-align:left;color:inherit;background:var(--surface);border:1px solid var(--ctl);border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer}
.device.desktop .osnote{top:auto;right:16px;bottom:16px;left:auto;width:380px}
.toast{position:absolute;bottom:76px;left:50%;z-index:35;max-width:calc(100% - 32px);padding:10px 16px;font-size:13.5px;color:var(--surface);background:var(--text);border-radius:var(--r-md);box-shadow:var(--shadow);transform:translateX(-50%)}
.device.desktop .toast{bottom:20px}

/* Website layout */
.page{flex:1;min-height:0;overflow:auto;background:var(--app-bg)}
.container{width:100%;max-width:1040px;margin:0 auto;padding:0 24px}
.hero{margin-bottom:14px;padding:18px 16px;background:var(--primary-soft);border-radius:var(--r-lg)}
.hero h1,.hero h2{margin:0 0 6px;font-size:24px;line-height:1.15;color:var(--text)}
.hero-sub{margin:0 0 12px;color:var(--text)}
.hero-search .search,.hero-search .filter,.hero-search .chips{margin-bottom:8px}
.hero-search .search input{min-height:52px;font-size:16px;box-shadow:var(--elev)}
.trustline{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:13px;color:var(--text)}
.hero-actions{display:flex;gap:8px;margin-top:10px}
.hero-foot{margin:10px 0 0;font-size:13.5px;color:var(--text)}
.hero.wide{margin:24px 0 20px;padding:44px 32px 30px;text-align:center}
.hero.wide h1{font-size:42px}
.hero.wide .hero-sub{margin-bottom:22px;font-size:17px}
.hero.wide .hero-search{max-width:720px;margin:0 auto}
.hero.wide .chips{justify-content:center}
.hero.wide .trustline{justify-content:center;margin-top:10px}
.steps{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none;counter-reset:step;text-align:left}
.steps li{position:relative;display:grid;padding-left:38px;color:var(--text);counter-increment:step}
.steps li::before{content:counter(step);position:absolute;left:0;top:0;display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-avatar);background:var(--surface);border:1px solid var(--ctl);font:700 13px/1 var(--font-head)}
.steps span{font-size:13.5px;color:var(--muted)}
.hero .steps span{color:var(--text)}
.steps.row{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps.row li{padding:18px 18px 18px 58px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.steps.row li::before{left:18px;top:18px}
.how{margin:36px 0 12px}
.how h2{margin:0 0 4px;font-size:24px}
.results{min-height:120px}
.device.desktop .results .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.device.desktop .results .meta-row{margin:0 0 12px;font-size:14px}
.device.desktop .results .card{padding:18px}
.card-foot{display:flex;justify-content:flex-end;margin-top:10px}
.card-link{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--link)}
.sitefoot{margin-top:40px;padding:20px 0 28px;background:var(--surface);border-top:1px solid var(--border)}
.sitefoot .container{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;color:var(--muted)}
.crumbs{display:flex;align-items:center;gap:8px;margin:20px 0 16px;font-size:13.5px;color:var(--muted)}
.profile-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;margin-bottom:8px}
.profile-main{padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.profile-main .profile-head{margin-top:0}
.profile-main .section:last-child{margin-bottom:0}
.profile-aside{position:sticky;top:20px;display:grid;gap:14px}
.aside-card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.aside-card h3{margin:18px 0 8px;font:600 12.5px/1.4 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.aside-card .muted{margin:8px 0 0}
.profile-aside .note{margin:0;background:var(--surface);border:1px solid var(--border)}
.state>.ic{box-sizing:content-box;padding:14px;border-radius:50%;background:var(--surface-2);color:var(--link)}
.device.desktop .center-col{margin-top:32px;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
@media (max-width:900px){
  .device.desktop .results .cards{grid-template-columns:1fr}
  .profile-grid{grid-template-columns:1fr}
  .profile-aside{position:static}
  .steps.row{grid-template-columns:1fr}
  .hero.wide{padding:28px 18px 22px}
  .hero.wide h1{font-size:30px}
}

/* Ratings, portfolio, reports, information pages */
.rating{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:13.5px}
.stars{display:inline-flex;gap:1px;font-size:15px;line-height:1}
.star{color:var(--ctl)}
.star.on{color:var(--link)}
.rating-link{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0;border:0;background:none;font-size:13.5px;cursor:pointer}
.rating-link:hover{text-decoration:underline}
.device.phone .rating-link{min-height:44px}
.profile-head .rating{margin-top:2px}
.sortctl{display:inline-flex;flex:none;align-items:center;gap:6px;font-size:13px}
.sortctl select{min-height:36px;padding:0 8px;border:1px solid var(--ctl);border-radius:var(--r-md);background:var(--surface)}
.device.phone .sortctl select{min-height:44px}
.meta-row .linkbtn{margin-left:4px}
.pf{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.pf li{padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--app-bg)}
.pf-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.pf p{margin:6px 0 0;font-size:14px}
.pf .pf-result{font-weight:600}
.rev-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rev-sum{display:flex;align-items:center;gap:8px}
.rev-avg{font:700 26px/1 var(--font-head)}
.revs{display:grid;gap:10px;margin:10px 0 0;padding:0;list-style:none}
.rev{padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md)}
.rev-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rev-who{font-weight:600}
.rev-top .time{margin-left:auto}
.rev p{margin:6px 0 0}
.rev-reply{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm);font-size:14px}
.rev-reply textarea{display:block;width:100%;margin-top:6px;padding:9px 12px;background:var(--surface);border:1px solid var(--ctl);border-radius:var(--r-md)}
.rev-reply .actions{margin-top:8px}
.rev-report{display:block;margin-top:8px;font-size:12.5px;font-weight:400}
.report-row{margin:14px 0 0;font-size:13px}
.report-row .linkbtn{font-weight:400}
.starpick{display:flex;gap:6px}
.starbtn{width:48px;height:48px;border:1px solid var(--ctl);border-radius:var(--r-md);background:var(--surface);color:var(--ctl);font-size:24px;line-height:1;cursor:pointer}
.starbtn.on{color:var(--link);border-color:var(--link);background:var(--primary-soft)}
.reasons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.thread-tools{display:flex;justify-content:flex-end;gap:14px;margin-bottom:4px;font-size:12.5px}
.thread-tools .linkbtn{font-weight:400}
.agree{margin:14px 0 4px;text-align:left}
.choice:disabled{opacity:.5;cursor:not-allowed}
.infolinks{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.content>.infolinks,.single-inner>.infolinks{justify-content:center;margin-top:22px}
.narrow{max-width:760px;margin:0 auto}
.panel{margin:24px 0;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--elev)}
.panel h1{margin:0 0 12px;font-size:28px}
.prose .lead{margin:0 0 6px;font-size:17px}
.faq{margin:0}
.faq dt{margin-top:14px;font-weight:700}
.faq dd{margin:4px 0 0}
.benefits{display:grid;gap:10px;margin:16px 0;padding:0;list-style:none}
.benefits li{display:grid;gap:2px;padding:14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--app-bg)}
.benefits span{font-size:14px;color:var(--muted)}
.device.desktop .benefits{grid-template-columns:repeat(3,minmax(0,1fr))}
.osnote{cursor:default}
.osnote .actions{margin-top:8px;gap:6px}

}

/* ---------- Directory loading ---------- */
let dirTok = 0;
function resetDir() { dirTok++; S.dir.status = 'idle'; }
function startDirLoad() {
  S.dir.status = 'loading';
  if (S.dirScenario === 'slow') return;
  const tok = ++dirTok;
  setTimeout(() => {
    if (tok !== dirTok) return;
    if (!S.online || S.dirScenario === 'error') S.dir.status = 'error';
    else {
      S.dir.status = 'ready';
      S.dir.data = S.dirScenario === 'empty' ? [] : listedProfiles();
    }
    render();
  }, 700);
}

function saveEditor() {
  const ed = S.editor;
  if (!ed) return;
  ed.errors = validateFormat(ed.f);
  if (Object.keys(ed.errors).length) { ed.status = 'invalid'; S.focusSel = '#err-summary'; render(); return; }
  if (!S.online) { ed.status = 'failed'; render(); return; }
  ed.status = 'saving';
  render();
  setTimeout(() => {
    if (S.editor !== ed) return;
    const f = JSON.parse(JSON.stringify(ed.f));
    f.experience = f.experience.filter(x => x.role || x.org || x.start || x.end);
    f.experience.forEach(x => { if (x.current) x.end = ''; });
    f.portfolio = (f.portfolio || []).filter(x => x.title.trim() || x.work.trim());
    ed.f.portfolio = JSON.parse(JSON.stringify(f.portfolio));
    ed.f.experience = JSON.parse(JSON.stringify(f.experience));
    const rec = Object.assign({ id: ed.accId }, f, { listed: missingFields(f).length === 0, deleted: false });
    const existing = PROFILES.find(p => p.id === ed.accId);
    if (existing) Object.assign(existing, rec); else PROFILES.push(rec);
    if (S.me && S.me.accountantId === ed.accId) S.me.name = f.name || S.me.name;
    ed.dirty = false;
    ed.status = 'saved';
    resetDir();
    render();
  }, 800);
}

  let conv = mine.find(c => c.id === (isAcc ? 'c2' : 'c4')) || mine[0];
  if (!conv && isAcc) { conv = { id: nid('c'), clientId: 'u-ramon', clientName: 'Ramon Castillo', accountantId: S.me.accountantId, unread: { client: 0, accountant: 0 }, messages: [] }; CONVS.push(conv); }
  if (!conv) { toast('Prototype: this client has no conversations yet. Message an accountant first.'); return; }
  const texts = isAcc
    ? ['Hello, are you available for a quick question about payroll?', 'Thanks! Do you also handle the annual return?', 'Could we schedule a call this week?']
    : ['Hi! Following up on my last message. Does Thursday work for a call?', 'I can also send a checklist of what I need from you.', 'Let me know when you have the documents ready.'];
  conv.messages.push({ id: nid('m'), from: isAcc ? 'client' : 'accountant', text: texts[conv.messages.length % texts.length], at: new Date().toISOString(), status: 'sent' });
  const r = parseRoute();
  const viewing = r.name === 'thread' && r.id === conv.id;
  if (!viewing) conv.unread[S.me.role] = (conv.unread[S.me.role] || 0) + 1;
  if (viewing) toast('Prototype: no email, because you have this conversation open.');
  else if (!S.emailOn) toast('Prototype: no email, because email notifications are off. The unread mark still updates.');
  else if (conv.emailed) toast('Prototype: no second email for this conversation until you open it (proposal for D18).');
  else {
    conv.emailed = true;
    S.emailNote = { convId: conv.id, from: peerName(conv), to: S.me.email };
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { S.emailNote = null; render(); }, 12000);
    render();
    announce('Email sent to ' + S.me.email + ': new message from ' + peerName(conv) + '.');
  }
}
const JUMPS = {
  clients: () => { setPersona('accountant'); go('#/workspace'); },
  'my-accountants': () => { setPersona('client'); go('#/workspace'); },
  'service-progress': () => { setPersona('accountant'); go('#/work/e1'); },
  directory: () => go('#/directory'),
  profile: () => go('#/profile/a2'),
  reviews: () => { setPersona('client'); go('#/profile/a1'); },
  review: () => { setPersona('client'); go('#/review/a1'); },
  reply: () => { setPersona('accountant'); go('#/profile/a1'); },
  foracc: () => go('#/for-accountants'),
  help: () => go('#/help'),
  privacy: () => go('#/privacy'),
  notfound: () => go('#/no-such-page'),
  removed: () => go('#/profile/a9'),
  compose: () => { setPersona('visitor'); go('#/compose/a3'); },
  signin: () => { setPersona('visitor'); S.signin = { step: 'choose', next: '#/directory' }; go('#/signin'); },
  'client-thread': () => { setPersona('client'); go('#/thread/c1'); },
  chats: () => { setPersona('accountant'); go('#/chats'); },
  thread: () => { setPersona('accountant'); go('#/thread/c2'); },
  editor: () => { setPersona('accountant'); go('#/me/profile'); },
  'editor-new': () => { setPersona('newAccountant'); go('#/me/profile'); },
  'delete': () => { setPersona('client'); S.del = null; go('#/me/delete'); }
};
let signTok = 0;
const ACTIONS = {
  'rerender': () => render(),
  'starter': el => {
    const r = parseRoute();
    S.drafts[r.name === 'compose' ? 'compose:' + r.accId : 'thread:' + r.id] = STARTERS[+el.dataset.i];
    S.focusSel = '#composer';
    render();
  },
  'toggle-how': () => { S.howOpen = !S.howOpen; render(); },
  'goto-reviews': () => { S.focusSel = '#reviews-h'; render(); },
  'pick-star': el => { if (S.review) { S.review.stars = +el.dataset.n; S.review.error = ''; } render(); },
  'save-review': () => {
    const rv = S.review; if (!rv) return;
    if (!rv.stars) { rv.error = 'Choose a rating from 1 to 5 stars.'; S.focusSel = '[data-fkey="star-1"]'; render(); return; }
    if (!S.online) { rv.error = 'No connection. Your review is still here. Try again when you\'re back online.'; render(); return; }
    const mine = REVIEWS.find(r => r.accountantId === rv.accId && r.clientId === S.me.clientId);
    if (mine) { mine.stars = rv.stars; mine.text = rv.text.trim(); mine.at = new Date().toISOString(); }
    else REVIEWS.push({ id: nid('r'), accountantId: rv.accId, clientId: S.me.clientId, clientName: S.me.name, stars: rv.stars, text: rv.text.trim(), at: new Date().toISOString(), reply: null });
    const id = rv.accId; S.review = null;
    go('#/profile/' + id);
    toast(mine ? 'Your review was updated.' : 'Your review was posted.');
  },
  'delete-review': () => {
    const rv = S.review; if (!rv) return;
    const i = REVIEWS.findIndex(r => r.accountantId === rv.accId && r.clientId === S.me.clientId);
    if (i >= 0) REVIEWS.splice(i, 1);
    const id = rv.accId; S.review = null;
    go('#/profile/' + id);
    toast('Your review was deleted.');
  },
  'reply-review': el => { const r = REVIEWS.find(x => x.id === el.dataset.id); if (!r) return; S.replyTo = r.id; S.replyDraft = r.reply ? r.reply.text : ''; S.focusSel = '#reply-text'; render(); },
  'save-reply': el => {
    const r = REVIEWS.find(x => x.id === el.dataset.id), t = (S.replyDraft || '').trim();
    if (!r || !t) { toast('Write a reply first.'); return; }
    r.reply = { text: t, at: new Date().toISOString() }; S.replyTo = null; S.replyDraft = '';
    toast('Your reply was posted.');
  },
  'cancel-reply': () => { S.replyTo = null; S.replyDraft = ''; render(); },
  'report': el => {
    if (!S.me) { S.signin = { step: 'choose', next: location.hash }; go('#/signin'); toast('Sign in to send a report.'); return; }
    S.report = { kind: el.dataset.kind, id: el.dataset.id, reason: '', details: '', error: '' };
    render();
  },
  'report-reason': el => { if (S.report) { S.report.reason = REPORT_REASONS[+el.dataset.i]; S.report.error = ''; } render(); },
  'report-cancel': () => { S.report = null; render(); },
  'report-send': () => {
    if (!S.report) return;
    if (!S.report.reason) { S.report.error = 'Choose a reason.'; render(); return; }
    S.report = null;
    toast('Thanks. Your report was sent to the Tax Buddy team.');
  },
  'block': el => {
    const c = CONVS.find(x => x.id === el.dataset.id); if (!c) return;
    S.blockTarget = c.id;
    S.dialog = { id: 'block', title: 'Block ' + firstName(peerName(c)) + '?', body: 'They won\'t be able to message you, and they aren\'t told. You can unblock them later.',
      actions: [{ label: 'Cancel', action: 'dlg-keep' }, { label: 'Block', action: 'block-confirm', kind: 'danger' }] };
    render();
  },
  'block-confirm': () => {
    const c = CONVS.find(x => x.id === S.blockTarget);
    S.dialog = null; S.blockTarget = null;
    if (c && S.me) { c.blockedBy = S.me.role; toast('Blocked. They can\'t message you.'); } else render();
  },
  'unblock': el => { const c = CONVS.find(x => x.id === el.dataset.id); if (c) c.blockedBy = null; toast('Unblocked.'); },
  'email-unsub': () => { S.emailOn = false; S.emailNote = null; clearTimeout(noteTimer); go('#/email-off'); },
  'add-pf': () => { const f = S.editor.f; f.portfolio.push({ title: '', sector: '', work: '', result: '' }); S.editor.dirty = true; S.focusSel = '#f-pf-' + (f.portfolio.length - 1) + '-title'; render(); },
  'del-pf': el => { S.editor.f.portfolio.splice(+el.dataset.i, 1); S.editor.errors = {}; S.editor.dirty = true; S.focusSel = '#add-pf'; render(); },
  'retry-dir': () => { if (S.dirScenario === 'error') S.dirScenario = 'normal'; resetDir(); render(); },
  'clear-search': () => { S.dir.search = ''; S.dir.service = ''; S.dir.shown = PAGE; S.focusSel = '#q'; render(); },
  'service': el => { S.dir.service = el.dataset.val; S.dir.shown = PAGE; render(); },
  'more': () => {
    const list = filtered(), next = list[S.dir.shown];
    S.dir.shown += PAGE;
    if (next) S.focusSel = '[data-fkey="card-' + next.id + '"]';
    render();
  },
  'start-signin': el => { S.signin = { step: 'choose', next: el.dataset.next || '#/directory' }; go('#/signin'); },
  'provider': el => {
    const si = S.signin; if (!si) return;
    si.step = 'opening'; si.provider = el.dataset.provider; si.error = null;
    render();
    const tok = ++signTok;
    setTimeout(() => {
      if (tok !== signTok || !S.signin || S.signin.step !== 'opening') return;
      if (!S.online) { S.signin.step = 'choose'; S.signin.error = 'Couldn\'t reach Tax Buddy. Check your connection and try again.'; }
      else S.signin.step = 'role';
      render();
    }, 1400);
  },
  'signin-cancel': () => { signTok++; if (S.signin) { S.signin.step = 'choose'; S.signin.error = null; } render(); announce('Sign-in cancelled.'); },
  'choose-role': el => {
    const si = S.signin || {};
    const prov = si.provider || 'Google', next = si.next || '#/directory';
    S.signin = null;
    if (el.dataset.role === 'client') {
      S.me = Object.assign({}, PERSONAS.client, { provider: prov });
      go(next === '#/signin' || next === '#/me/profile' ? '#/directory' : next);
      toast('Signed in as ' + S.me.name + '.');
    } else {
      S.me = Object.assign({}, PERSONAS.newAccountant, { provider: prov });
      S.editor = null;
      go('#/me/profile');
      toast(next.indexOf('#/compose/') === 0 ? 'Accountants can\'t start chats. Create your profile so clients can find you.' : 'Signed in. Create your profile so clients can find you.');
    }
  },
  'send': el => send(el.dataset.key),
  'retry-msg': el => {
    let m = null;
    CONVS.forEach(c => c.messages.forEach(x => { if (x.id === el.dataset.mid) m = x; }));
    if (!m) return;
    if (!S.online) { toast('You\'re still offline. The message is kept.'); return; }
    m.status = 'sending'; render();
    setTimeout(() => { m.status = 'sent'; render(); announce('Message sent.'); }, 700);
  },
  'sign-out': () => { S.me = null; S.editor = null; S.emailNote = null; go('#/directory'); toast('Signed out.'); },
  'toggle-email': () => { S.emailOn = !S.emailOn; toast(S.emailOn ? 'Email notifications are on.' : 'Email notifications are off.'); },
  'open-note': () => {
    const n = S.emailNote; S.emailNote = null; clearTimeout(noteTimer);
    if (!n) return;
    if (!S.me) { S.signin = { step: 'choose', next: '#/chats' }; go('#/signin'); return; }
    go('#/thread/' + n.convId);
  },
  'add-exp': () => { const f = S.editor.f; f.experience.push({ role: '', org: '', start: '', end: '', current: false }); S.editor.dirty = true; S.focusSel = '#f-exp-' + (f.experience.length - 1) + '-role'; render(); },
  'del-exp': el => { S.editor.f.experience.splice(+el.dataset.i, 1); S.editor.errors = {}; S.editor.dirty = true; S.focusSel = '[data-fkey="add-exp"]'; render(); },
  'add-svc': () => { const f = S.editor.f; f.services.push({ name: '', desc: '' }); S.editor.dirty = true; S.focusSel = '#f-svc-' + (f.services.length - 1) + '-name'; render(); },
  'del-svc': el => { S.editor.f.services.splice(+el.dataset.i, 1); S.editor.errors = {}; S.editor.dirty = true; S.focusSel = '[data-fkey="add-svc"]'; render(); },
  'save-profile': () => saveEditor(),
  'focus-field': el => { const t = app.querySelector('#' + el.dataset.target); if (t) { t.focus({ preventScroll: true }); reveal(t); } },
  'del-continue': () => { S.del.step = 2; S.focusSel = '[data-fkey="del-confirm"]'; render(); },
  'del-confirm': () => {
    const d = S.del;
    if (!S.online) { d.status = 'failed'; render(); return; }
    d.status = 'deleting'; render();
    setTimeout(() => {
      if (S.del !== d || d.status !== 'deleting') return;
      if (S.me && S.me.role === 'accountant') { const p = PROFILES.find(x => x.id === S.me.accountantId); if (p) { p.deleted = true; p.listed = false; } }
      S.me = null; S.editor = null; S.emailOn = true; S.emailNote = null; S.del = null;
      resetDir();
      go('#/directory');
      toast('Your account was deleted.');
    }, 1100);
  },
  'dlg-keep': () => { S.dialog = null; S.guardTarget = null; render(); },
  'dlg-discard': () => { const t = S.guardTarget; S.dialog = null; S.guardTarget = null; S.editor = null; if (t) location.hash = t; else render(); }
};
Object.assign(ACTIONS, W.actions);
function edTouched() {
  S.editor.dirty = true;
  if (S.editor.status === 'saved' || S.editor.status === 'failed') {
    S.editor.status = 'idle';
    const s = app.querySelector('[data-save-status]');
    if (s) { s.textContent = ''; s.className = 'save-status'; }
  }
  const cl = app.querySelector('[data-checklist]');
  if (cl) {
    const prof = PROFILES.find(p => p.id === S.editor.accId);
    cl.innerHTML = checklistInner(S.editor.f, !!(prof && prof.listed && !prof.deleted));
  }
}
function tryAction(kind, k, v) {
  switch (kind) {
    case 'scenario': S[k] = v; if (k === 'dirScenario') resetDir(); render(); break;
    case 'go': go(v); break;
    case 'role': setPersona(v); render(); break;
    case 'device': S.device = v; render(); break;
    case 'offline': S.online = false; render(); break;
    case 'offline-reload': S.online = false; resetDir(); render(); break;
    case 'push': if (!S.me || S.me.role !== 'accountant') setPersona('accountant'); simulatePush(); render(); break;
    case 'jump': if (JUMPS[v]) JUMPS[v](); break;
  }
}

/* ---------- Events ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !app.contains(el)) return;
  const h = ACTIONS[el.dataset.action];
  if (h) { e.preventDefault(); h(el, e); }
});
app.addEventListener('input', e => {
  const el = e.target, b = el.dataset ? el.dataset.bind : null;
  if (!b) return;
  if (W.input(el)) return;
  if (b === 'search') { S.dir.search = el.value; S.dir.shown = PAGE; updateDirResults(); }
  else if (b === 'draft') { S.drafts[el.dataset.key] = el.value; updateComposer(el.dataset.key); autoGrow(el); }
  else if (b === 'ed' && el.type !== 'checkbox') {
    S.editor.f[el.dataset.field] = el.value; edTouched();
    if (el.dataset.field === 'summary') { const c = app.querySelector('[data-count-summary]'); if (c) c.textContent = num(el.value.length); }
  }
  else if (b === 'ed-exp') { S.editor.f.experience[+el.dataset.i][el.dataset.field] = el.value; edTouched(); }
  else if (b === 'ed-pf') { S.editor.f.portfolio[+el.dataset.i][el.dataset.field] = el.value; edTouched(); }
  else if (b === 'review-text') { if (S.review) S.review.text = el.value; }
  else if (b === 'reply-draft') { S.replyDraft = el.value; }
  else if (b === 'report-details') { if (S.report) S.report.details = el.value; }
  else if (b === 'ed-svc' && el.tagName !== 'SELECT') { S.editor.f.services[+el.dataset.i][el.dataset.field] = el.value; edTouched(); }
});
app.addEventListener('change', e => {
  const el = e.target, b = el.dataset ? el.dataset.bind : null;
  if (!b) return;
  if (W.change(el)) return;
  if (b === 'service-select') { S.dir.service = el.value; S.dir.shown = PAGE; render(); }
  else if (b === 'sort-select') { S.dir.sort = el.value; S.dir.shown = PAGE; render(); }
  else if (b === 'agree') { if (S.signin) S.signin.agree = el.checked; render(); }
  else if (b === 'ed' && el.type === 'checkbox') { S.editor.f[el.dataset.field] = el.checked; edTouched(); render(); }
  else if (b === 'ed-exp-current') { const x = S.editor.f.experience[+el.dataset.i]; x.current = el.checked; if (el.checked) x.end = ''; edTouched(); render(); }
  else if (b === 'ed-svc' && el.tagName === 'SELECT') { S.editor.f.services[+el.dataset.i].name = el.value; edTouched(); }
});
app.addEventListener('keydown', e => {
  const el = e.target;
  if (el.id === 'composer' && S.device === 'desktop' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(el.dataset.key); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.dialog) ACTIONS['dlg-keep']();
  else if (S.report) ACTIONS['report-cancel']();
});
notesEl.addEventListener('click', e => {
  const b = e.target.closest('[data-try]');
  if (b) tryAction(b.dataset.try, b.dataset.k, b.dataset.v);
});
window.addEventListener('hashchange', () => {
  const target = location.hash;
  if (S.route === '#/me/profile' && target !== '#/me/profile' && S.editor && S.editor.dirty) {
    S.guardTarget = target;
    history.replaceState(null, '', S.route);
    S.dialog = { id: 'discard', title: 'Discard your changes?', body: 'Your profile edits haven\'t been saved.',
      actions: [{ label: 'Keep editing', action: 'dlg-keep' }, { label: 'Discard', action: 'dlg-discard', kind: 'danger' }] };
    render();
    return;
  }
  onRoute();
});

/* Prototype controls */
document.querySelector('.skip-link').addEventListener('click', e => { e.preventDefault(); $id('device').focus(); });
$id('dev-phone').addEventListener('click', () => { S.device = 'phone'; render(); });
$id('dev-desktop').addEventListener('click', () => { S.device = 'desktop'; render(); });
$id('sel-role').addEventListener('change', e => { setPersona(e.target.value); render(); });
$id('net-on').addEventListener('click', () => { S.online = true; render(); });
$id('net-off').addEventListener('click', () => { S.online = false; render(); });
$id('sel-theme').addEventListener('change', e => { S.theme = e.target.value; applyTheme(); });
$id('sel-look').addEventListener('change', e => { S.look = e.target.value; render(); });
$id('sel-palette').addEventListener('change', e => { S.palette = e.target.value; render(); });
$id('sel-dir').addEventListener('change', e => { S.dirScenario = e.target.value; resetDir(); render(); });
$id('sel-send').addEventListener('change', e => { S.sendScenario = e.target.value; });
$id('btn-push').addEventListener('click', simulatePush);
$id('sel-jump').addEventListener('change', e => { const v = e.target.value; e.target.value = ''; if (JUMPS[v]) JUMPS[v](); });
$id('chk-notes').addEventListener('change', e => { S.notes = e.target.checked; render(); });
$id('btn-reset').addEventListener('click', () => { history.replaceState(null, '', location.pathname + '#/directory'); location.reload(); });

$id('sel-work-data').addEventListener('change', e => { W.dataMode=e.target.value; render(); });
$id('sel-work-save').addEventListener('change', e => { W.saveScenario=e.target.value; });
$id('sel-work-upload').addEventListener('change', e => { W.uploadScenario=e.target.value; });

/* Start */
themeQuery.addEventListener('change', applyTheme);
applyTheme();
if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/directory');
S.route = location.hash;
if (parseRoute().name === 'signin') S.signin = { step: 'choose', next: '#/directory' };
render();
})();
</script>
